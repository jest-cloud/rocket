type Query {
  user(id: ID!): User
  post(id: ID!): Post
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
}

union _Entity = User | Post

type User @key(fields: "id") {
  id: ID!
  name: String!
  email: String!
}

type Post @key(fields: "id") {
  id: ID!
  title: String!
  authorId: ID!
}

